version: 2

project_name: safeclaw

before:
  hooks:
    # Fails if go.mod or go.sum are not tidy, without changing them.
    - go mod tidy -diff
    - sh -c 'mkdir -p completions && for sh in bash zsh fish; do go run ./cmd/safeclaw completion "$sh" > "completions/safeclaw.$sh"; done'

builds:
  - main: ./cmd/safeclaw
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/josegonzalez/safeclaw/internal/version.Version={{.Version}}
      - -X github.com/josegonzalez/safeclaw/internal/version.Commit={{.ShortCommit}}
      - -X github.com/josegonzalez/safeclaw/internal/version.Date={{.Date}}

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - completions/*

checksum:
  name_template: checksums.txt

# GitHub writes the notes, one line per merged pull request with its
# number, grouped by label as .github/release.yml sets out.
changelog:
  use: github-native
